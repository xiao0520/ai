[project]
name = "ai-service"
version = "0.1.0"
description = "RuoYi-AI Python execution plane runtime"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.2.12,<1.3.0",
    "openai>=3.5.0,<4.0.0",
    "httpx2>=2.12.0,<3.0.0",
    "pydantic-settings>=2.6.0",
    "aiokafka>=0.12,<1",
    "pypdf>=6.18.1,<7",
    "python-docx>=1.2,<2",
    "tiktoken>=0.14,<1",
    "arkruntime>=0.6,<1",
    "langchain-qdrant==1.1.0",
    "qdrant-client==1.19.0",
    "jieba==0.42.1",
    "pillow>=12.3,<13",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "volcengine>=1.0.0,<2.0.0",
    "langchain[mcp]>=1.4.0,<1.5.0",
    "pypdfium2>=5,<6",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "rfc3339-validator>=0.1.4,<1",
    "ruff>=0.8.0",
    "types-jsonschema>=4.23,<5",
    "types-openpyxl>=3.1,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/typings"]
